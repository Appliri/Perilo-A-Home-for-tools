<script>/* perilo-bridge */window.__PRL_CFG={mount:'.hbar'};
/* Perilo room bridge — added to every tool page. Standalone, the tool is unchanged.
   Inside the house it: turns Esc and the tool's own back control into "Return to room",
   adds that control where the tool has none, and pauses sound, media and camera while
   the visitor is back in the rooms so nothing keeps playing behind the house. */
(function(){
  if (/prl-view/.test(location.hash)) {
    /* opened as a memory in the jar: the page plays on its own, so its way "back" is switched off */
    try { history.back = function(){}; history.go = function(){}; } catch(_){}
    var vs = document.createElement('style'); vs.textContent = '[aria-label="Return to entrance"],[aria-label="Return to room"],.back-text,.back-circle,#back,#back2,.prl-back,.prl-backwrap,[data-prl-back]{display:none!important}';
    (document.head || document.documentElement).appendChild(vs);
    document.addEventListener('click', function(e){ var a = e.target.closest && e.target.closest('#back,#back2,.back-circle,.back-text,[data-prl-back],[aria-label="Return to entrance"],[aria-label="Return to room"]'); if (a) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
    return;
  }
  if (window.parent === window) return;
  var CFG = window.__PRL_CFG || {};
  var root = document.documentElement;
  root.classList.add('in-perilo');
  var post = function(m){ try { m.perilo = 1; parent.postMessage(m, '*'); } catch(e){} };
  var back = function(){ post({ type: 'return' }); };

  /* --- keep track of everything that can make sound or use the camera --- */

  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var Tracked = class extends AC { constructor(a){ super(a); ctxs.push(this); } };
    window.AudioContext = Tracked; if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
  }
  var play = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function(){ media.add(this); return play.apply(this, arguments); };
  var md = navigator.mediaDevices;
  if (md && md.getUserMedia) {
    var gum = md.getUserMedia.bind(md);
    md.getUserMedia = function(c){ return gum(c).then(function(s){ streams.push(s); return s; }); };
  }
  var asleep = false, woke = [];
  function sleep(){
    if (asleep) return; asleep = true; woke = [];
    ctxs.forEach(function(c){ if (c.state === 'running') { woke.push(function(){ c.resume(); }); c.suspend(); } });
    media.forEach(function(m){ if (!m.paused) { woke.push(function(){ var p = play.call(m); if (p && p.catch) p.catch(function(){}); }); m.pause(); } });
    streams.forEach(function(s){ s.getTracks().forEach(function(t){ if (t.readyState === 'live' && t.enabled) { t.enabled = false; woke.push(function(){ t.enabled = true; }); } }); });
  }
  function wake(){ if (!asleep) return; asleep = false; woke.forEach(function(f){ try { f(); } catch(e){} }); woke = []; }
  window.addEventListener('message', function(e){
    var d = e.data; if (!d || !d.perilo) return;
    if (d.type === 'sleep') sleep();
    if (d.type === 'wake') { wake(); try { window.focus(); } catch(_){} if (window.__prlWoke) { try { window.__prlReplay && window.__prlReplay(); } catch(_){} } window.__prlWoke = 1; }
    if (d.type === 'theme' && d.theme) { window.__prlQuiet = 1; try { if (window.__prlSetTheme) window.__prlSetTheme(d.theme); else root.dataset.theme = d.theme; } catch(_){} window.__prlQuiet = 0; }
  });

  /* --- Esc: the tool gets first say (intro, full screen, dialogs, selection); otherwise go back --- */
  function busy(){
    if (document.fullscreenElement || document.webkitFullscreenElement) return true;
    if (document.querySelector('.fsfake, .modal.show, dialog[open]')) return true;
    try { return !!(CFG.busy && CFG.busy()); } catch(e){ return false; }
  }
  var pending = null, late = null;
  window.addEventListener('keydown', function(e){
    if (e.key !== 'Escape' || e.repeat) return;
    if (late) window.removeEventListener('keydown', late);
    var t = document.activeElement, field = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && !/^(range|checkbox|radio|button|color|file)$/.test(t.type) || t.isContentEditable);
    pending = { e: e, wasBusy: busy(), field: field ? t : null };
    late = function(ev){
      window.removeEventListener('keydown', late); late = null;
      var p = pending; pending = null;
      if (!p || p.e !== ev || ev.defaultPrevented || p.wasBusy) return;
      if (p.field) { p.field.blur(); return; }
      back();
    };
    window.addEventListener('keydown', late); /* added now, so it runs after the tool's own handlers */
  }, true);

  /* --- the tool's own "Return to entrance" becomes "Return to room" --- */
  var SEL = '[aria-label="Return to entrance"], .back-text, .back-circle, #back, #back2, .prl-back, [data-prl-back], a[href="../"], a[href=".."], a[href="./"], a[href="../index.html"]';
  var ARROW = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>';
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest(SEL);
    if (!a) return;
    e.preventDefault(); e.stopImmediatePropagation(); back();
  }, true);
  function relabel(){
    document.querySelectorAll(SEL).forEach(function(el){
      /* mark it so it is still caught after relabelling, and stop links from leaving the tool */
      el.setAttribute('data-prl-back', '');
      if (el.tagName === 'A') { el.setAttribute('href', '#'); el.setAttribute('role', 'button'); }
      el.removeAttribute('data-ico');
      var txt = (el.textContent || '').trim();
      if (!txt || !/[a-z]/i.test(txt)) { el.innerHTML = ARROW; el.classList.add('prl-circle'); }
      else if (el.querySelector('svg')) { el.innerHTML = ARROW + '<span>Return to room</span>'; el.classList.add('prl-combo'); }
      else { el.textContent = 'Return to room'; el.classList.add('prl-text'); }
      if (el.getAttribute('aria-label')) el.setAttribute('aria-label', 'Return to room');
      if (el.dataset && el.dataset.name) el.dataset.name = 'Return to room';
      if (el.dataset && el.dataset.tip) el.dataset.tip = 'Goes back to this room in the house. Esc works too.';
            el.setAttribute('title', 'Return to room (Esc)');
    });
    if (CFG.mount && !document.querySelector('.prl-back')) {
      var host = document.querySelector(CFG.mount);
      if (host) {
        var w = document.createElement('div'); w.className = 'prl-backwrap';
        w.innerHTML = '<button type="button" class="prl-back prl-circle" data-prl-back aria-label="Return to room" title="Return to room (Esc)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button><button type="button" class="prl-back prl-text">Return to room</button>';
        host.insertBefore(w, host.firstChild);
      }
    }
    post({ type: 'ready' });
  }
  var css = document.createElement('style');
  css.textContent = '.prl-backwrap{display:flex;align-items:center;gap:6px;flex:none}'
    + '.prl-circle{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:50%;cursor:pointer;background:var(--color-back-button,#E1D5CD);color:var(--color-back-icon,#3C2014);box-shadow:0 10px 24px -14px rgba(80,45,20,.6);transition:transform .45s cubic-bezier(.22,1,.36,1),background .3s}'
    + '.prl-circle:hover{transform:translateX(-3px);background:#D7C9B8}'
    + '.prl-text{min-height:44px;padding:0 8px;border:0;background:none;cursor:pointer;font:600 12.5px/1 Inter,system-ui,sans-serif;letter-spacing:.02em;color:var(--muted,#625149)}'
    + '.prl-text:hover{color:var(--text,#3B2F2A)}'
    + '.prl-back:focus-visible,[data-prl-back]:focus-visible{outline:2px solid #6fc2c2;outline-offset:3px}'
    + '.prl-circle,[data-prl-back].prl-circle{width:42px!important;height:42px!important;min-width:42px!important;padding:0!important;margin:0!important;display:grid!important;place-items:center!important;border:0!important;border-radius:50%!important;background:#E1D5CD!important;color:#3C2014!important;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)!important;cursor:pointer;text-decoration:none!important;transition:transform .45s cubic-bezier(.22,1,.36,1),background .3s!important}'
    + '.prl-circle svg,[data-prl-back] svg{width:20px!important;height:20px!important;flex:none;fill:none!important;stroke:currentColor!important}'
    + '.prl-circle:hover,[data-prl-back].prl-circle:hover{transform:translateX(-3px)!important;background:#F0E6DC!important}'
    + '[data-prl-back].prl-text,.prl-text{min-height:44px!important;padding:0 8px!important;border:0!important;background:none!important;font:600 13px/1 Inter,system-ui,sans-serif!important;letter-spacing:.02em!important;text-transform:none!important;text-decoration:none!important;color:inherit;opacity:.85;cursor:pointer;display:inline-flex!important;align-items:center}'
    + '[data-prl-back].prl-text:hover{opacity:1}'
    + '[data-prl-back].prl-combo{display:inline-flex!important;align-items:center;gap:10px;font:600 13px/1 Inter,system-ui,sans-serif!important;text-transform:none!important;text-decoration:none!important;cursor:pointer}'
    + '@media (max-width:640px){.prl-text{display:none}}'
    + (CFG.css || '');
  (document.head || root).appendChild(css);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', relabel); else relabel();
  window.addEventListener('load', function(){ setTimeout(relabel, 60); });
})();
</script>
<script>/* perilo-jar: keep what you make. Saves a snapshot on demand, and keeps every export you download.
   Inside Perilo the house stores it; on its own the tool stores it in this browser (same jar). */
(function(){
  if (/prl-view/.test(location.hash)) return;
  var TOOL = {id:'kaleido',name:'Kaleidoscoop',file:'kaleidoscoop',canvases:['#cv']};
  var DB = 'perilo-jar', ST = 'works';
  function idb(){ return new Promise(function(ok, no){ if (!window.indexedDB) return no(new Error('This browser has no local database.'));
    var r = indexedDB.open(DB, 1); r.onupgradeneeded = function(){ r.result.createObjectStore(ST, { keyPath: 'id' }); };
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ no(r.error); }; }); }
  function saveLocal(w){ return idb().then(function(db){ return new Promise(function(ok, no){
    var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).put(w); t.oncomplete = function(){ ok(w); }; t.onerror = function(){ no(t.error); }; }); })
    .then(function(w){ try { new BroadcastChannel('perilo-jar').postMessage({ type: 'changed' }); } catch(_){} return w; }); }
  var waits = {};
  window.addEventListener('message', function(e){ var d = e.data; if (!d || !d.perilo || !d.nonce || !waits[d.nonce]) return;
    var w = waits[d.nonce]; delete waits[d.nonce]; clearTimeout(w.t); if (d.type === 'jar-saved') w.ok(d); else if (d.type === 'jar-error') w.no(new Error(d.msg || 'Could not save')); });
  function send(work){
    work.id = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); work.created = Date.now();
    work.tool = TOOL.id; work.toolName = TOOL.name;
    if (window.top === window) return saveLocal(work);
    return new Promise(function(ok, no){ var n = work.id; waits[n] = { ok: ok, no: no, t: setTimeout(function(){ delete waits[n]; saveLocal(work).then(ok, no); }, 1500) };
      try { window.top.postMessage({ perilo: 1, type: 'jar-save', nonce: n, work: work }, '*'); } catch(e){ clearTimeout(waits[n].t); delete waits[n]; saveLocal(work).then(ok, no); } }); }
  var kindOf = function(m){ m = m || ''; return /^image\//.test(m) ? 'image' : /^video\//.test(m) ? 'video' : /^audio\//.test(m) ? 'audio' : 'file'; };
  var stamp = function(){ var d = new Date(); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };

  /* ---------- snapshot: the tool's main canvas (layers composited), on its own background ---------- */
  function vis(c){ var r = c.getBoundingClientRect(), s = getComputedStyle(c); return r.width > 40 && r.height > 40 && s.display !== 'none' && s.visibility !== 'hidden' && +s.opacity > 0; }
  function pickCanvases(){ var out = []; (TOOL.canvases || []).forEach(function(sel){ var c = document.querySelector(sel); if (c && c.width > 8 && c.height > 8) out.push(c); });
    if (out.length && vis(out[0])) return out;
    var best = null, ba = 0; [].forEach.call(document.querySelectorAll('canvas'), function(c){ if (!vis(c) || c.width < 40) return; var r = c.getBoundingClientRect(),
      a = Math.max(0, Math.min(r.right, innerWidth) - Math.max(r.left, 0)) * Math.max(0, Math.min(r.bottom, innerHeight) - Math.max(r.top, 0)); if (a > ba) { ba = a; best = c; } });
    return best ? [best] : out; }
  function bgOf(el){ while (el && el !== document.documentElement) { var b = getComputedStyle(el).backgroundColor; if (b && b !== 'transparent' && !/rgba\(.*,\s*0\)$/.test(b)) return b; el = el.parentElement; }
    return getComputedStyle(document.body).backgroundColor || '#111'; }
  function snapshot(){ if (window.__prlThumb) return Promise.resolve().then(window.__prlThumb).then(function(b){ if (!b) throw new Error('Nothing to save yet.'); return b; }); var cs = pickCanvases(); if (!cs.length) return Promise.reject(new Error('Nothing to save yet.'));
    var a = cs[0], c = document.createElement('canvas'); c.width = a.width; c.height = a.height; var g = c.getContext('2d');
    g.fillStyle = bgOf(a); g.fillRect(0, 0, c.width, c.height);
    try { cs.forEach(function(x){ g.drawImage(x, 0, 0, c.width, c.height); }); } catch(e){ return Promise.reject(new Error('This picture can’t be saved (it uses a protected source).')); }
    return new Promise(function(ok, no){ try { c.toBlob(function(b){ b ? ok(b) : no(new Error('Could not read the canvas.')); }, 'image/png'); } catch(e){ no(new Error('This picture can’t be saved (it uses a protected source).')); } }); }

  /* ---------- the button and its little toast ---------- */
  var css = '.prl-jar{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:2147483000;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:0;border-radius:999px;'
    + 'background:rgba(30,23,20,.82);color:#f5ede6;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 30px -14px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,236,222,.12);'
    + 'font:600 13px/1 Inter,system-ui,sans-serif;cursor:pointer;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .4s,background .3s}'
    + '.prl-jar:hover{transform:translateY(-2px);background:rgba(42,33,28,.92)}.prl-jar:focus-visible{outline:2px solid #e0a779;outline-offset:3px}'
    + '.prl-jar svg{flex:none}.prl-jar.busy{opacity:.7;pointer-events:none}.prl-jar.off{opacity:0;pointer-events:none;transform:translateY(10px)}'
    + ':root[data-theme=light] .prl-jar{background:rgba(255,253,251,.9);color:#3B2F2A;box-shadow:0 14px 30px -14px rgba(80,45,20,.45),inset 0 0 0 1px rgba(60,35,20,.12)}'
    + '.prl-jt{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 54px);z-index:2147483000;max-width:min(360px,calc(100vw - 28px));padding:10px 16px;border-radius:14px;'
    + 'background:rgba(30,23,20,.94);color:#f5ede6;font:500 13px/1.35 Inter,system-ui,sans-serif;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);opacity:0;transform:translateY(8px);transition:opacity .35s,transform .5s cubic-bezier(.22,1,.36,1);pointer-events:none}'
    + '.prl-jt.on{opacity:1;transform:none}.prl-jt b{color:#e0a779}'
    + '@media print{.prl-jar,.prl-jt{display:none}}';
  var JAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8M9 3v3c-2.5 1-4 3-4 5.5V18a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6.5C19 9 17.5 7 15 6V3"/><circle cx="10.5" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="16.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.2" cy="12.2" r=".8" fill="currentColor" stroke="none"/></svg>';
  var btn, toast, tt = 0;
  function say(html){ if (!toast) return; toast.innerHTML = html; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('on'); }, 2800); }
  function busy(){ var b = document.body; return b.classList.contains('intro') || b.classList.contains('preintro') || !!document.querySelector('#intro:not(.gone):not([hidden]):not(.out)') && TOOL.id !== 'repaint'; }
  function mount(){ var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'prl-jar'; btn.innerHTML = JAR + '<span>Save to jar</span>';
    btn.title = 'Keep a snapshot of this in your Perilo memory jar'; btn.setAttribute('aria-label', 'Save a snapshot to your memory jar');
    toast = document.createElement('div'); toast.className = 'prl-jt'; toast.setAttribute('role', 'status'); toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(btn); document.body.appendChild(toast);
    btn.addEventListener('click', function(){ if (btn.classList.contains('busy')) return; btn.classList.add('busy'); var lbl = btn.querySelector('span'), base = lbl.textContent;
      var tick = function(t){ lbl.textContent = t; };
      /* a live save when the tool knows how (a playable scene or a recording); a picture otherwise */
      var live = window.__prlJarCapture ? Promise.resolve().then(function(){ return window.__prlJarCapture(tick); }) : null;
      var job = live ? live.then(function(r){ if (r.thumbBlob) return r; return snapshot().then(function(tb){ r.thumbBlob = tb; return r; }, function(){ return r; }); })
                     : snapshot().then(function(blob){ return { blob: blob, kind: 'image', mime: 'image/png', name: TOOL.file + '-' + Date.now() + '.png' }; });
      job.then(function(r){ return send({ title: (r.title || TOOL.name) + ' \u00b7 ' + stamp(), kind: r.kind, mime: r.mime, name: r.name, blob: r.blob, thumbBlob: r.thumbBlob || null, size: r.blob.size, source: r.kind === 'image' ? 'snapshot' : 'live' }).then(function(){ return r; }); })
        .then(function(r){ say(r.kind === 'scene' ? 'Saved to your <b>memory jar</b> as a live scene you can play.' : r.kind === 'video' ? 'Saved to your <b>memory jar</b> as a video.' : 'Saved to your <b>memory jar</b>.'); }, function(e){ say(e && e.message ? e.message : 'Could not save.'); })
        .then(function(){ btn.classList.remove('busy'); lbl.textContent = base; }); });

      return withThumb.then(function(tb){ return send({ title: (n || TOOL.name + ' export').replace(/\.[a-z0-9]+$/i, '') , kind: k, mime: k === 'scene' ? 'text/html' : (m || 'application/octet-stream'), name: n || (TOOL.file + '-export'), blob: b, thumbBlob: tb, size: b.size, source: 'export' }); }); })
      .then(function(){ say('Exported, and kept in your <b>memory jar</b>.'); }, function(){}); }

  document.addEventListener('click', function(e){ var a = e.target && e.target.closest && e.target.closest('a[download]'); if (a) try { keep(a); } catch(_){} }, true);
})();
</script>

 const mult=P.rel==="double"?2:P.rel==="half"?.5:1,r=rng(P.seed*13+5);let overlap=0;
 for(let i=1;i<P.layers;i++){
  const N=clamp(Math.round(P.N*Math.pow(mult,i)),2,32),Rb=base*Math.pow(P.ratio,i);
  const it={cx:items[0].cx,cy:items[0].cy,R:Rb,N,seed:P.seed+i*1013,tw:P.tw*(P.counter&&i%2?-1:1)+(i>1?.4:0),hole:0};
  if(P.arr==="sat"){
   const cands=SAT.map(p=>{const q=[p[0]*W,p[1]*H];return{p:q,d:Math.min(...items.map(o=>Math.hypot(q[0]-o.cx,q[1]-o.cy)))}}).sort((a,b)=>b.d-a.d);
   const pick=cands[Math.floor(r()*Math.min(3,cands.length))];it.cx=pick.p[0];it.cy=pick.p[1];
   let room=Infinity;items.forEach(o=>{room=Math.min(room,Math.hypot(it.cx-o.cx,it.cy-o.cy)-o.R*.82)});

 const s=sig(Tg);if(sigOld&&s!==sigOld&&!calm&&cv.width){ghost.width=cv.width;ghost.height=cv.height;ghost.getContext("2d").drawImage(cv,0,0);fade=1}

const mixHex=(h,t)=>{const n=parseInt(h.slice(1),16),f=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,"0");return"#"+f(n>>16)+f(n>>8&255)+f(n&255)};

 c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok({url:c.toDataURL("image/jpeg",.86),img:c})};im.onerror=()=>ok(null);im.src=state.pu});
function jarThumb(P,W,H,post){const k=Math.min(1,900/Math.max(W,H)),w=Math.round(W*k),h=Math.round(H*k),o=document.createElement("canvas");o.width=w;o.height=h;const x=o.getContext("2d");
 if(post)x.drawImage(post.img,0,0,w,h);else{const gr=x.createLinearGradient(0,0,w*.3,h);gr.addColorStop(0,"#f6dcb8");gr.addColorStop(.85,"#e0a779");x.fillStyle=gr;x.fillRect(0,0,w,h);
  x.fillStyle="#221a15";x.font=`700 ${Math.round(w*.17)}px "Space Grotesk",sans-serif`;x.fillText("Future",w*.08,h*.52);x.fillText("Forms",w*.08,h*.52+w*.16)}
 const t=document.createElement("canvas");t.width=w;t.height=h;renderAll(t.getContext("2d"),w,h,P);if(P.hue&&"filter"in x)x.filter=`hue-rotate(${P.hue}deg)`;x.drawImage(t,0,0);

 const nm="Kaleidoscope "+P.seed,J=v=>JSON.stringify(v).replace(/</g,"\\u003c");
 const html="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap\" rel=\"stylesheet\"><style>html,body{margin:0;height:100%;overflow:hidden;background:#0d0a09;color:#f5ede6;font-family:\"Space Grotesk\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}body{display:grid;place-items:center;padding:54px 0 64px;box-sizing:border-box}.bg{position:fixed;inset:0;background:radial-gradient(60% 55% at 50% 42%,rgba(196,103,58,.22),transparent 70%),#0d0a09}.fr{position:relative;border-radius:18px;overflow:hidden;background:#1d1612 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,236,222,.12),0 40px 90px -30px rgba(0,0,0,.8);cursor:grab;touch-action:none;transition:background-color .6s}.fr:active{cursor:grabbing}.fr.bare{background-image:none!important;background-color:transparent;box-shadow:none}.fr.bare .poster{opacity:0}.poster{position:absolute;inset:0;background:linear-gradient(165deg,#f6dcb8,#e0a779 85%);color:#221a15;padding:7% 8%;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .6s;pointer-events:none}.poster b{font:700 clamp(1.6rem,8vmin,5.5rem)/.95 \"Space Grotesk\",sans-serif;letter-spacing:-.04em}.poster span{font-size:clamp(.7rem,1.6vmin,1rem);font-weight:500}.poster em{position:absolute;right:6%;top:4%;font:400 .72rem \"Space Mono\",monospace;font-style:normal;opacity:.65}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(29,22,18,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,236,222,.12)}.ui button{font:500 13px \"Space Grotesk\",syste   "<canvas id=\"cv\" aria-label=\"Kaleidoscope, drag to turn it\"></canvas></div><p class=\"hint\" id=\"hint\">drag to turn \u00b7 scroll to zoom \u00b7 tap to pause</p><div class=\"ui\"><button id=\"pp\" type=\"button\" aria-pressed=\"false\">Pause</button><button id=\"po\" type=\"button\">Hide poster</button><button id=\"rs\" type=\"button\">Reset</button></div>"+
  "<script>\"use strict\";const P="+J(P)+";const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const rng="+rng.toString()+";\n"+eng+"\n"+"/* a kaleidoscope memory: the saved pattern keeps turning, and you can play with it */\n(function(){\n\"use strict\";\nconst calm=matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\nconst fr=document.getElementById(\"fr\"),cv=document.getElementById(\"cv\"),c=cv.getContext(\"2d\"),hint=document.getElementById(\"hint\");\nconst B={...P};let FW=B.W,FH=B.H;\n/* the frame keeps the poster's proportions and fills the window */\nfunction fit(){const vw=innerWidth,vh=innerHeight,pad=Math.min(vw,vh)<560?16:48,a=FW/FH,h=Math.min(vh-Math.max(pad*2,128),(vw-pad*2)/a),w=h*a;\n fr.style.width=Math.round(w)+\"px\";fr.style.height=Math.round(h)+\"px\";\n const k=Math.min(1,Math.min(1.5,devicePixelRatio||1)*Math.max(w,h)/Math.max(FW,FH)),W=Math.max(80,Math.round(FW*k)),H=Math.max(80,Math.round(FH*k));\n if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}dirty=true}\nlet dirty=true,paused=calm,tw=0,tv=0,win=0,zm=1,t=0,last=0,drag=null;\ncv.style.filter=B.hue?`hue-rotate(${B.hue}deg)`:\"\";\n/* drag turns the tube by hand (it keeps spinning when you let go), up and down slides the window, wheel or pinch zooms */\nfr.addEventListener(\"pointerdown\",e=>{drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};fr.setPointerCapture(e.pointerId);tv=0;hide()});\nfr.addEventListener(\"pointermove\",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,now=performance.now(),dt=Math.max(1,now-drag.t);\n drag.moved+=Math.abs(dx)+Math.abs(dy);tw+=dx*.006;tv=dx*.006/(dt/1000);win=Math.max(-.4,Math.min(.6,win+dy*.002));drag.x=e.clientX;drag.y=e.clientY;drag.t=now;dirty=true});\nconst up=()=>{if(drag&&drag.moved<6)toggle();drag=null};fr.addEventListener(\"pointerup\",up);fr.addEventListener(\"pointercancel\",()=>drag=null);\naddEventListener(\"wheel\",e=>{e.preventDefault();zm=Math.max(.5,Math.min(2.4,zm*Math.exp(-e.deltaY*.0012)));dirty=true;hide()},{passive:false});\nconst $b=id=>document.getElementById(id);\nfunction toggle(){paused=!paused;$b(\"pp\").textContent=paused?\"Play\":\"Pause\";$b(\"pp\").setAttribute(\"aria-pressed\",String(paused))}\n$b(\"pp\").onclick=toggle;$b(\"pp\").textContent=paused?\"Play\":\"Pause\";\n$b(\"po\").onclick=()=>{const on=fr.classList.toggle(\"bare\");$b(\"po\").textContent=on?\"Show poster\":\"Hide poster\"};\n$b(\"rs\").onclick=()=>{tw=0;tv=0;win=0;zm=1;t=0;dirty=true};\naddEventListener(\"keydown\",e=>{if(e.key===\" \"){e.preventDefault();toggle()}else if(e.key===\"p\"||e.key===\"P\")$b(\"po\").click();else if(e.key===\"r\"||e.key===\"R\")$b(\"rs\").click()});\nlet hid=false;function hide(){if(hid)return;hid=true;hint.classList.add(\"gone\")}setTimeout(hide,5200);\nfunction tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(document.hidden)return;\n if(!drag&&Math.abs(tv)>.002){tw+=tv*dt;tv*=Math.exp(-dt*2.2);dirty=true}\n if(!paused){t+=dt;tw+=dt*.16;dirty=true}\n if(!dirty)return;dirty=false;\n const Q={...B};Q.tw=B.tw+tw;Q.win=Math.max(0,Math.min(1,B.win+win+(paused?0:.05*Math.sin(t*.23))));Q.zm=B.zm*zm*(paused?1:1+.035*Math.sin(t*.6));\n renderAll(c,cv.width,cv.height,Q)}\naddEventListener(\"resize\",fit);fit();requestAnimationFrame(tick);\n})();\n".replace(/<\/script/g,"<\\/script")+"<\/script></body></html>";
 return{blob:new Blob([html],{type:"text/html"}),kind:"scene",mime:"text/html",name:`kaleidoscoop-${P.seed}.html`,title:nm,thumbBlob:await jarThumb(P,W,H,post)}};

/* ---------- steps ---------- */
const beadsEl=document.querySelectorAll(".bead");
function words(el,t){el.textContent=t}
function go(i){
 i=clamp(i,0,STEPS.length-1);const dir=i>=state.step?1:-1;state.step=i;
 document.querySelectorAll(".step").forEach((el,j)=>el.hidden=j!==i);
 beadsEl.forEach((b,j)=>{b.toggleAttribute("aria-current",j===i);if(j===i)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");b.classList.toggle("done",j<i)});
 g("blob").style.transform=`translateX(${i*100}%)`;
 words(g("stepName"),STEPS[i].name);words(g("stepLead"),STEPS[i].lead);

/* ---------- examples ---------- */
const ADJ=["Wobbly","Marmalade","Sleepy","Fizzy","Velvet","Tipsy","Glittery","Crumpled","Moonlit","Jammy","Giddy","Pocket"],NOUN=["Bloom","Snowglobe","Confetti","Pinwheel","Daydream","Lantern","Compass","Windmill","Carousel","Sundae","Mosaic","Starfish"];

function genEx(n){const used=new Set(),pals=Object.keys(ACC);
 return Array.from({length:n},(_,i)=>{let name;do{name=pk(ADJ)+" "+pk(NOUN)}while(used.has(name));used.add(name);
  return{name,pal:pals[(ri(0,7)+i*3)%pals.length],N:ri(4,12),mir:Math.random()<.85,mix:ri(10,95),cnt:ri(24,56),con:ri(4,9),spc:pk(["free","even","clustered"]),ori:pk(["radial","random"]),
   seed:ri(0,99999),layers:pk([1,2,2,3]),arr:Math.random()<.2?"sat":"nested",rel:pk(["same","double","half"]),rad:ri(75,95),fade:ri(25,45),zm:ri(85,130),win:ri(25,60)}})}

 const set={fold:e.N,mix:e.mix,cnt:e.cnt,con:e.con,spc:e.spc,ori:e.ori,seed:e.seed,lay:e.layers,arr:e.arr,rel:e.rel,rad:e.rad,hole:0,fade:e.fade,zm:e.zm,win:e.win,tw:20,hue:0};

/* ---------- hero: a swarm of fragments that folds into a kaleidoscope ---------- */
const hero$=g("hero"),sw=g("swarm"),hc=g("heroCv"),sx=sw.getContext("2d"),hx=hc.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
const NP=calm?700:1700,PR=Array.from({length:NP},(_,i)=>({i,a:Math.random()*6.283,r:Math.sqrt(Math.random()),ph:Math.random()*6.28,ph2:Math.random()*6.28,sp:.5+Math.random(),x:0,y:0,px:0,py:0,fx:0,fy:0}));

 cx=(h.left+h.width/2-b.left)*dpr;cy=(h.top+h.height/2-b.top)*dpr;HR=Math.max(120,h.width*.5*dpr*1.05);PR.forEach(p=>{p.px=cx;p.py=cy})}

function setStage(n,e){
 stageNo=n;const cap=g("cap"),tt=g("exTitle"),sub=g("exSub"),title=n===3;

 if(title){tt.textContent=e.name;sub.textContent=`${PALS[e.pal].n} palette, ${e.N} folds, ${e.layers} layer${e.layers>1?"s":""}. Made from ${e.cnt} fragments.`}else cap.textContent=CAPS[n];
 if(!calm)(title?[tt,sub]:[cap]).forEach((el,k)=>el.animate([{opacity:0,transform:"translateY(26px)"},{opacity:1,transform:"none"}],{duration:800,delay:k*90,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"}))}
const COUNT=g("count");let lastCount="";
function hero(now){
 if(scrollY>innerHeight*1.3||!sw.width)return;

  const fx=cx+Math.cos(fa)*fr*HR*1.7+Math.sin(t*.35+p.ph2)*HR*.2,fy=cy+Math.sin(fa)*fr*HR*.9+Math.cos(t*.3+p.ph)*HR*.15;
  const k=p.i%(2*e.N),phi=s*(.5+.5*Math.sin(t*.55*p.sp+p.ph)),rr=HR*(.1+.9*p.r)*(.92+.08*Math.sin(t*.4+p.ph2));
  const ang=(k%2?(k+1)*s-phi:k*s+phi)+t*.18,gx=cx+Math.cos(ang)*rr,gy=cy+Math.sin(ang)*rr;
  p.x=fx+(gx-fx)*m;p.y=fy+(gy-fy)*m}
 for(let c=0;c<nc;c++){sx.strokeStyle=cols[c];sx.beginPath();
  for(let i=c;i<NP;i+=nc){const p=PR[i];sx.moveTo(p.px,p.py);sx.lineTo(p.x,p.y);p.px+=(p.x-p.px)*.3;p.py+=(p.y-p.py)*.3}sx.stroke()}
 sx.globalAlpha=1;sx.globalCompositeOperation="source-over";
 if(ea>.01){renderAll(hx,520,520,exP(e,t*.16));hc.style.opacity=ea;hc.style.transform=`scale(${.9+.1*ea}) rotate(${(1-ea)*-16}deg)`}else hc.style.opacity=0;
 const n=Math.round(e.cnt+(e.cnt*2*e.N-e.cnt)*ss(.8,5,T)).toLocaleString();if(n!==lastCount){lastCount=n;COUNT.textContent=n}

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>calm?el.classList.add("in"):io.observe(el));

/* init */
buildCards();applyEx(EX[0]);go(0);accent(EX[0]);fit();restart(0);requestAnimationFrame(tick);
})();
