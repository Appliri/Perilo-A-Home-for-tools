   the visitor is back in the rooms so nothing keeps playing behind the house. */

    + '.prl-circle:hover,[data-prl-back].prl-circle:hover{transform:translateX(-3px)!important;background:#F0E6DC!important}'
    + '[data-prl-back].prl-text,.prl-text{min-height:44px!important;padding:0 8px!important;border:0!important;background:none!important;font:600 13px/1 Inter,system-ui,sans-serif!important;letter-spacing:.02em!important;text-transform:none!important;text-decoration:none!important;color:inherit;opacity:.85;cursor:pointer;display:inline-flex!important;align-items:center}'

    + '@media (max-width:640px){.prl-text{display:none}}'
    + (CFG.css || '');
  (document.head || root).appendChild(css);

<script>/* perilo-jar: keep what you make. Saves a snapshot on demand, and keeps every export you download.
   Inside Perilo the house stores it; on its own the tool stores it in this browser (same jar). */
(function(){
  if (/prl-view/.test(location.hash)) return;
  var TOOL = {id:'repaint',name:'Repaint',file:'repaint',canvases:['#stage']};
  var DB = 'perilo-jar', ST = 'works';

    var r = indexedDB.open(DB, 1); r.onupgradeneeded = function(){ r.result.createObjectStore(ST, { keyPath: 'id' }); };
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ no(r.error); }; }); }

    var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).put(w); t.oncomplete = function(){ ok(w); }; t.onerror = function(){ no(t.error); }; }); })
    .then(function(w){ try { new BroadcastChannel('perilo-jar').postMessage({ type: 'changed' }); } catch(_){} return w; }); }
  var waits = {};

    if (window.top === window) return saveLocal(work);

  var kindOf = function(m){ m = m || ''; return /^image\//.test(m) ? 'image' : /^video\//.test(m) ? 'video' : /^audio\//.test(m) ? 'audio' : 'file'; };

    var best = null, ba = 0; [].forEach.call(document.querySelectorAll('canvas'), function(c){ if (!vis(c) || c.width < 40) return; var r = c.getBoundingClientRect(),
      a = Math.max(0, Math.min(r.right, innerWidth) - Math.max(r.left, 0)) * Math.max(0, Math.min(r.bottom, innerHeight) - Math.max(r.top, 0)); if (a > ba) { ba = a; best = c; } });

  /* ---------- the button and its little toast ---------- */
  var css = '.prl-jar{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:2147483000;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:0;border-radius:999px;'

    + 'font:600 13px/1 Inter,system-ui,sans-serif;cursor:pointer;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .4s,background .3s}'
    + '.prl-jar:hover{transform:translateY(-2px);background:rgba(42,33,28,.92)}.prl-jar:focus-visible{outline:2px solid #e0a779;outline-offset:3px}'
    + '.prl-jar svg{flex:none}.prl-jar.busy{opacity:.7;pointer-events:none}.prl-jar.off{opacity:0;pointer-events:none;transform:translateY(10px)}'
    + ':root[data-theme=light] .prl-jar{background:rgba(255,253,251,.9);color:#3B2F2A;box-shadow:0 14px 30px -14px rgba(80,45,20,.45),inset 0 0 0 1px rgba(60,35,20,.12)}'
    + '.prl-jt{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 54px);z-index:2147483000;max-width:min(360px,calc(100vw - 28px));padding:10px 16px;border-radius:14px;'

    + '.prl-jt.on{opacity:1;transform:none}.prl-jt b{color:#e0a779}'
    + '@media print{.prl-jar,.prl-jt{display:none}}';
  var JAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8M9 3v3c-2.5 1-4 3-4 5.5V18a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6.5C19 9 17.5 7 15 6V3"/><circle cx="10.5" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="14" cy="16.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.2" cy="12.2" r=".8" fill="currentColor" stroke="none"/></svg>';
  var btn, toast, tt = 0;
  function say(html){ if (!toast) return; toast.innerHTML = html; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('on'); }, 2800); }
  function busy(){ var b = document.body; return b.classList.contains('intro') || b.classList.contains('preintro') || !!document.querySelector('#intro:not(.gone):not([hidden]):not(.out)') && TOOL.id !== 'repaint'; }
  function mount(){ var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'prl-jar'; btn.innerHTML = JAR + '<span>Save to jar</span>';

      var job = live ? live.then(function(r){ if (r.thumbBlob) return r; return snapshot().then(function(tb){ r.thumbBlob = tb; return r; }, function(){ return r; }); })
                     : snapshot().then(function(blob){ return { blob: blob, kind: 'image', mime: 'image/png', name: TOOL.file + '-' + Date.now() + '.png' }; });
      job.then(function(r){ return send({ title: (r.title || TOOL.name) + ' \u00b7 ' + stamp(), kind: r.kind, mime: r.mime, name: r.name, blob: r.blob, thumbBlob: r.thumbBlob || null, size: r.blob.size, source: r.kind === 'image' ? 'snapshot' : 'live' }).then(function(){ return r; }); })
        .then(function(r){ say(r.kind === 'scene' ? 'Saved to your <b>memory jar</b> as a live scene you can play.' : r.kind === 'video' ? 'Saved to your <b>memory jar</b> as a video.' : 'Saved to your <b>memory jar</b>.'); }, function(e){ say(e && e.message ? e.message : 'Could not save.'); })

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaint — photo playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#FBF7F4;--panel:#F5F1EA;--panel2:#E8D8CE;--line:#998574;--text:#3B2F2A;--muted:#625149;--accent:#7D5A44;--focus:#245C5C;--sl:#643B47;--sh:#CBB3A1;--stage:#1d1612;--sel:#6fc2c2;--radius:6px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110e;--panel:#211914;--panel2:#33261e;--line:#6d5a4c;--text:#f0e6dd;--muted:#bda999;--accent:#d9a074;--focus:#6fc2c2;--sl:#d9a074;--sh:#4a3a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110e;--panel:#211914;--panel2:#33261e;--line:#6d5a4c;--text:#f0e6dd;--muted:#bda999;--accent:#d9a074;--focus:#6fc2c2;--sl:#d9a074;--sh:#4a3a2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:12px/1.5 "Space Mono",ui-monospace,Menlo,monospace;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mark{display:grid;place-items:center;width:36px;height:36px;background:var(--accent);color:var(--bg);font-size:20px;border-radius:50%}
.eyebrow{margin:0;font-size:10px;color:var(--accent);letter-spacing:.1em}
h1{font:700 22px "Space Grotesk",system-ui,sans-serif;letter-spacing:-.02em;margin:0;text-transform:lowercase}
.tb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let W,H,R,G,B,L,GM,GX,GY,seed=7,cx;
const l1=document.createElement('canvas'),l2=document.createElement('canvas');
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const g=(a,x,y)=>{x=x<0?0:x>=W?W-1:x|0;y=y<0?0:y>=H?H-1:y|0;return a[y*W+x]};
const cl=(v,a,b)=>v<a?a:v>b?b:v,hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const hsl=(r,g,b)=>{r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let h=0,s=0;if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]};
const rgb=(h,s,l)=>{const f=(p,q,t)=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};if(!s)return[l*255,l*255,l*255];const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;return[f(p,q,h+1/3)*255,f(p,q,h)*255,f(p,q,h-1/3)*255]};
function blur(a,r){const o=new Float32Array(a.length),t=new Float32Array(a.length),n=2*r+1;
 for(let y=0;y<H;y++){let s=0;for(let x=-r;x<=r;x++)s+=a[y*W+cl(x,0,W-1)];for(let x=0;x<W;x++){t[y*W+x]=s/n;s+=a[y*W+Math.min(W-1,x+r+1)]-a[y*W+Math.max(0,x-r)]}}
 for(let x=0;x<W;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[cl(y,0,H-1)*W+x];for(let y=0;y<H;y++){o[y*W+x]=s/n;s+=t[Math.min(H-1,y+r+1)*W+x]-t[Math.max(0,y-r)*W+x]}}return o}
const n_=(k,l,a,b,v)=>({k,l,t:'r',a,b,v}),s_=(k,l,o,v)=>({k,l,t:'s',o,v}),c_=(k,l,v)=>({k,l,t:'c',v});
const PALS={Orange:['#ff6a13','#ff2e8a','#e8c22a','#2fa5b8','#7ae01a'],Primary:['#ff4f58','#2b4fd8','#fcb6d0','#f7d046','#2fa58a'],Earth:['#513229','#d97f4a','#fce6b7','#8a9a5b','#8fb8dc']};

const STYLES={
cubism:{name:'Cubism',note:'Planes that snap to edges, each seeing a shifted view.',
c:[n_('size','Shard size',14,120,40),n_('fract','Fracture',0,100,55),n_('snap','Edge snap',0,100,60),n_('view','Shifted viewpoints',0,100,30),n_('punch','Colour punch',50,260,150),n_('steps','Colour steps',3,16,7),n_('line','Outline',0,10,3)],
r(p){const rand=rng(seed),size=p.size,cols=Math.ceil(W/size),rows=Math.ceil(H/size),gx=W/cols,gy=H/rows,pts=[];
 for(let j=0;j<=rows;j++){pts[j]=[];for(let i=0;i<=cols;i++){let x=i*gx,y=j*gy;const e=i>0&&i<cols,f=j>0&&j<rows;
  if(e)x+=(rand()-.5)*gx*p.fract/62;if(f)y+=(rand()-.5)*gy*p.fract/62;
  if(e&&f&&p.snap){let bx=x,by=y,bm=-1;for(let k=0;k<12;k++){const a=rand()*6.28,d=rand()*size*.45,qx=x+Math.cos(a)*d,qy=y+Math.sin(a)*d,m=g(GM,qx,qy);if(m>bm){bm=m;bx=qx;by=qy}}x+=(bx-x)*p.snap/100;y+=(by-y)*p.snap/100}
  pts[j][i]=[x,y]}}
 cx.fillStyle=cx.strokeStyle='#2a1710';cx.fillRect(0,0,W,H);cx.lineJoin='round';cx.lineWidth=p.line;
 const tri=(a,b,c)=>{const o1=(rand()-.5)*size*p.view/50,o2=(rand()-.5)*size*p.view/50,mx=(a[0]+b[0]+c[0])/3+o1,my=(a[1]+b[1]+c[1])/3+o2;
  let r=0,gg=0,bb=0;[[mx,my],...[a,b,c].map(q=>[mx+(q[0]+o1-mx)*.5,my+(q[1]+o2-my)*.5])].forEach(s=>{r+=g(R,s[0],s[1]);gg+=g(G,s[0],s[1]);bb+=g(B,s[0],s[1])});
  let[h,s,l]=hsl(r/4,gg/4,bb/4);s=Math.min(1,s*p.punch/100);l=cl(Math.round(l*p.steps)/p.steps,.07,.93);const q=rgb(h,s,l);
  cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.lineTo(...c);cx.closePath();cx.fillStyle=`rgb(${q[0]|0},${q[1]|0},${q[2]|0})`;cx.fill();if(p.line)cx.stroke()};
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=pts[j][i],b=pts[j][i+1],c=pts[j+1][i],d=pts[j+1][i+1];if(rand()>.5){tri(a,b,d);tri(a,d,c)}else{tri(a,b,c);tri(b,d,c)}}}},

halftone:{name:'Halftone',note:'Ink dots on a rotated screen, as a printer would lay them.',
c:[n_('cell','Cell size',5,36,14),n_('angle','Screen angle',0,90,45),n_('gain','Dot gain',50,160,100),n_('min','Minimum dot',0,60,0),n_('contrast','Contrast',50,300,140),n_('grain','Grain',0,100,25),s_('shape','Dot shape',['Circle','Square','Diamond','Line'],'Circle'),s_('mode','Ink',['Duotone','Photo colour'],'Duotone'),s_('inv','Invert',['No','Yes'],'No'),c_('ink','Ink','#513229'),c_('paper','Paper','#F4F1E2')],
r(p){const rand=rng(seed),c=p.cell,Lb=blur(L,Math.max(1,c>>1)),a=p.angle*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),n=Math.hypot(W,H);
 cx.fillStyle=p.paper;cx.fillRect(0,0,W,H);cx.fillStyle=p.ink;
 for(let v=-n/2;v<n/2;v+=c)for(let u=-n/2;u<n/2;u+=c){const x=W/2+u*ca-v*sa,y=H/2+u*sa+v*ca;if(x<-c||y<-c||x>W+c||y>H+c)continue;
  let d=g(Lb,x,y);d=p.inv==='Yes'?d:1-d;d=cl((d-.5)*p.contrast/100+.5,0,1);const r=Math.max(p.min*c/200,c*.72*Math.sqrt(d)*p.gain/100*.7);if(r<.3)continue;
  if(p.mode!=='Duotone')cx.fillStyle=`rgb(${g(R,x,y)|0},${g(G,x,y)|0},${g(B,x,y)|0})`;
  if(p.shape==='Circle'){cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
  else{cx.save();cx.translate(x,y);cx.rotate(a+(p.shape==='Diamond'?Math.PI/4:0));if(p.shape==='Line')cx.fillRect(-c*.6,-r*.7,c*1.2,r*1.4);else cx.fillRect(-r,-r,r*2,r*2);cx.restore()}}
 const gn=p.grain*W*H/400;for(let i=0;i<gn;i++){cx.fillStyle=rand()>.5?p.ink:p.paper;cx.globalAlpha=.5;cx.fillRect(rand()*W,rand()*H,1.4,1.4)}cx.globalAlpha=1}},

pop:{name:'Pop art',note:'Black stencil, flat colour, loose shapes, a little misregistration.',
c:[n_('ink','Ink threshold',10,70,38),n_('levels','Tone levels',2,6,4),n_('detail','Stencil detail',0,100,40),n_('off','Misregistration',0,30,8),n_('shapes','Floating shapes',0,24,9),n_('ssize','Shape size',5,40,18),n_('sop','Shape opacity',20,100,70),n_('marks','Doodle bursts',0,20,6),s_('pal','Palette',Object.keys(PALS),'Orange'),c_('hi','Highlights','#fffdf4')],
r(p){const rand=rng(seed),pal=PALS[p.pal],lv=p.levels,Lb=blur(L,1),n=W*H,tb=pal.map(hx),c1=l1.getContext('2d'),c2=l2.getContext('2d'),A=c1.createImageData(W,H),I=c2.createImageData(W,H),hi_=hx(p.hi);
 for(let i=0;i<n;i++){const l=Lb[i],q=Math.min(lv-1,Math.floor(l*lv)),col=q===lv-1?hi_:tb[(q*2+(R[i]>B[i]?0:1))%tb.length],o=i*4;
  A.data[o]=col[0];A.data[o+1]=col[1];A.data[o+2]=col[2];A.data[o+3]=255;
  if(l<p.ink/100*.9||GM[i]>.22-p.detail/100*.16){I.data[o]=30;I.data[o+1]=16;I.data[o+2]=12;I.data[o+3]=255}}
 c1.putImageData(A,0,0);c2.putImageData(I,0,0);cx.fillStyle=p.hi;cx.fillRect(0,0,W,H);cx.drawImage(l1,p.off,p.off*.6);
 cx.globalCompositeOperation='multiply';
 for(let k=0;k<p.shapes;k++){const x=rand()*W,y=rand()*H,s=(.4+rand())*p.ssize*W/100,t=rand()*4|0;cx.fillStyle=pal[(rand()*pal.length)|0];cx.globalAlpha=p.sop/100;cx.beginPath();
  if(t===0)cx.arc(x,y,s/2,0,7);else if(t===1)cx.rect(x-s/2,y-s/2,s,s*.8);else if(t===2){for(let q=0;q<10;q++){const r=q%2?s*.22:s*.5,a=q*Math.PI/5-Math.PI/2;cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath()}else{cx.arc(x,y,s/2,0,7);cx.moveTo(x+s/3.2,y);cx.arc(x,y,s/3.2,0,7,true)}cx.fill('evenodd')}
 cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.drawImage(l2,0,0);
 cx.lineCap='round';cx.lineWidth=W*.005;for(let k=0;k<p.marks;k++){const x=rand()*W,y=rand()*H,b=rand()*6.28;cx.strokeStyle=pal[(rand()*pal.length)|0];for(let q=0;q<5;q++){const a=b+q*.28;cx.beginPath();cx.moveTo(x+Math.cos(a)*W*.02,y+Math.sin(a)*W*.02);cx.lineTo(x+Math.cos(a)*W*.05,y+Math.sin(a)*W*.05);cx.stroke()}}}},

ghibli:{name:'Ghibli',note:'Soft cel bands, warm light, lines in brown rather than black.',
c:[n_('smooth','Paint smoothing',1,8,3),n_('bands','Cel bands',3,12,6),n_('cel','Cel hardness',0,100,60),n_('line','Line strength',0,100,45),n_('lift','Colour lift',0,100,35),n_('glow','Warm light',0,100,50),n_('lx','Light left',0,100,75),n_('ly','Light top',0,100,15),n_('shade','Cool shadow',0,100,40),n_('grain','Paper grain',0,30,8)],
r(p){const rand=rng(seed),r_=p.smooth|0,Rb=blur(R,r_),Gb=blur(G,r_),Bb=blur(B,r_),img=cx.createImageData(W,H),d=img.data,lx=p.lx/100*W,ly=p.ly/100*H,m=Math.max(W,H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,o=i*4;let[h,s,l]=hsl(Rb[i],Gb[i],Bb[i]);const q=Math.round(l*p.bands)/p.bands;l=l*(1-p.cel/100)+q*p.cel/100;s=Math.min(1,s*(1+p.lift/100*.8));if(h>.22&&h<.7)l=Math.min(1,l+.03*p.lift/50);
  let c=rgb(h,s,l);const gl=Math.max(0,1-Math.hypot(x-lx,y-ly)/m*1.6)*p.glow/100,sh=l<.4?(.4-l)/.4*p.shade/100*.45:0;
  const tgt=[255,214,150],cool=[70,85,140],a=gl*.35;for(let k=0;k<3;k++){c[k]=c[k]+(tgt[k]-c[k])*a;c[k]+=(cool[k]-c[k])*sh}
  const e=cl((GM[i]-.03)*p.line/100*12,0,1),ln=[96,56,40];const gr=(rand()-.5)*p.grain*2;
  for(let k=0;k<3;k++)d[o+k]=c[k]+(ln[k]-c[k])*e+gr;d[o+3]=255}
 cx.putImageData(img,0,0)}},

acrylic:{name:'Acrylic',note:'Loaded brushes laid coarse to fine over a thin underpainting.',
c:[n_('size','Brush size',4,40,12),n_('len','Stroke length',1,8,3),n_('dens','Stroke density',20,150,60),n_('follow','Follow form',0,100,70),n_('bris','Bristles',1,8,4),n_('rel','Impasto relief',0,100,50),n_('jit','Colour jitter',0,60,18),n_('weave','Canvas weave',0,100,30)],
r(p){const rand=rng(seed),n=W*H,u=cx.createImageData(W,H),Rb=blur(R,10),Gb=blur(G,10),Bb=blur(B,10);
 for(let i=0;i<n;i++){u.data[i*4]=Rb[i];u.data[i*4+1]=Gb[i];u.data[i*4+2]=Bb[i];u.data[i*4+3]=255}cx.putImageData(u,0,0);cx.lineCap='round';
 [2,1,.5].forEach(f=>{const sz=Math.max(2,p.size*f),cnt=Math.min(26000,W*H/(sz*sz)*p.dens/50);
  for(let k=0;k<cnt;k++){const x=rand()*W,y=rand()*H,ea=Math.atan2(g(GY,x,y),g(GX,x,y))+Math.PI/2,ang=(rand()*Math.PI)*(1-p.follow/100)+ea*p.follow/100,len=p.len*sz*(.6+rand()*.8),
   dx=Math.cos(ang),dy=Math.sin(ang),px=-dy,py=dx,j=(rand()-.5)*p.jit*2.5,r=cl(g(R,x,y)+j,0,255),gg=cl(g(G,x,y)+j,0,255),b=cl(g(B,x,y)+j,0,255),nb=p.bris|0;
   for(let q=0;q<nb;q++){const o=(q-(nb-1)/2)/nb*sz,v=(rand()-.5)*22;cx.strokeStyle=`rgb(${cl(r+v,0,255)|0},${cl(gg+v,0,255)|0},${cl(b+v,0,255)|0})`;cx.lineWidth=sz/nb*1.5;
    cx.beginPath();cx.moveTo(x+px*o-dx*len/2,y+py*o-dy*len/2);cx.lineTo(x+px*o+dx*len/2,y+py*o+dy*len/2);cx.stroke()}
   if(p.rel){cx.lineWidth=1.3;const o=sz*.5;cx.strokeStyle=`rgba(255,255,255,${p.rel/400})`;cx.beginPath();cx.moveTo(x-px*o-dx*len/2,y-py*o-dy*len/2);cx.lineTo(x-px*o+dx*len/2,y-py*o+dy*len/2);cx.stroke();
    cx.strokeStyle=`rgba(0,0,0,${p.rel/500})`;cx.beginPath();cx.moveTo(x+px*o-dx*len/2,y+py*o-dy*len/2);cx.lineTo(x+px*o+dx*len/2,y+py*o+dy*len/2);cx.stroke()}}});
 cx.fillStyle=`rgba(40,20,10,${p.weave/1200})`;for(let y=0;y<H;y+=3)cx.fillRect(0,y,W,1);for(let x=0;x<W;x+=3)cx.fillRect(x,0,1,H)}}
};

STYLES.sketch={name:'Pencil',note:'Graphite lines and cross-hatching on paper.',
c:[n_('line','Line strength',0,100,70),n_('hatch','Hatching',0,100,45),n_('hsp','Hatch spacing',3,12,5),n_('paper','Paper tone',0,100,60),n_('jit','Paper noise',0,100,30)],
r(p){const rand=rng(seed),img=cx.createImageData(W,H),d=img.data,Lb=blur(L,1),h=p.hsp|0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,o=i*4;let v=250-p.paper*.25;v-=cl(GM[i]*p.line/100*14,0,1)*200;const l=Lb[i];
  if((x+y)%h===0&&l<.55)v-=p.hatch*(.55-l)*1.5;if((x-y+H*16)%h===0&&l<.3)v-=p.hatch*(.3-l)*2;v+=(rand()-.5)*p.jit*.4;v=cl(v,0,255);d[o]=v;d[o+1]=v*.98;d[o+2]=v*.93;d[o+3]=255}
 cx.putImageData(img,0,0)}};
STYLES.pixel={name:'Pixel art',note:'Chunky pixels snapped to a small set of tones.',
c:[n_('px','Pixel size',3,30,10),n_('lv','Tone levels',2,10,5),n_('dith','Dither',0,100,30),n_('sat','Saturation',50,220,120),s_('grid','Grid lines',['No','Yes'],'No')],
r(p){const s=p.px|0,w=Math.ceil(W/s),h=Math.ceil(H/s),lv=p.lv;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){let r=0,gg=0,b=0,n=0;for(let y=j*s;y<Math.min(H,j*s+s);y+=2)for(let x=i*s;x<Math.min(W,i*s+s);x+=2){const k=y*W+x;r+=R[k];gg+=G[k];b+=B[k];n++}
  let[hh,ss,l]=hsl(r/n,gg/n,b/n);ss=Math.min(1,ss*p.sat/100);const t=(((i&1)*2+(j&1)*3)%4)/4-.375;l=cl(Math.round(l*lv+t*p.dith/100)/lv,0,1);const q=rgb(hh,ss,l);
  cx.fillStyle=`rgb(${q[0]|0},${q[1]|0},${q[2]|0})`;cx.fillRect(i*s,j*s,s,s)}
 if(p.grid==='Yes'){cx.fillStyle='rgba(0,0,0,.18)';for(let x=0;x<W;x+=s)cx.fillRect(x,0,1,H);for(let y=0;y<H;y+=s)cx.fillRect(0,y,W,1)}}};
STYLES.watercolor={name:'Watercolour',note:'Soft washes that pool darker at the edges, on rough paper.',
c:[n_('wash','Wash softness',2,14,6),n_('lv','Colour pools',3,14,8),n_('edge','Edge pooling',0,100,40),n_('pale','Paleness',0,80,25),n_('grain','Paper grain',0,100,40)],
r(p){const rand=rng(seed),r_=p.wash|0,Rb=blur(R,r_),Gb=blur(G,r_),Bb=blur(B,r_),img=cx.createImageData(W,H),d=img.data;
 for(let i=0;i<W*H;i++){const o=i*4;let[h,s,l]=hsl(Rb[i],Gb[i],Bb[i]);l=l*.5+Math.round(l*p.lv)/p.lv*.5;s*=.9;l=l+(1-l)*p.pale/100*.6;const c=rgb(h,s,l),e=cl(GM[i]*p.edge/100*6,0,.5),gr=(rand()-.5)*p.grain*.6;
  for(let k=0;k<3;k++)d[o+k]=c[k]*(1-e*.6)+gr;d[o+3]=255}cx.putImageData(img,0,0)}};
STYLES.neon={name:'Neon',note:'Glowing edges over a dark, colour-shifted photo.',
c:[n_('glow','Glow',0,100,60),n_('dark','Darkness',0,100,70),n_('hue','Hue shift',0,100,0),n_('edge','Edge strength',0,100,70)],
r(p){const img=cx.createImageData(W,H),d=img.data,E=blur(GM,3),k=1-p.dark/100*.9;
 for(let i=0;i<W*H;i++){const o=i*4,e=cl(GM[i]*p.edge/100*14,0,1),gl=cl(E[i]*p.glow/100*22,0,1),a=cl(e+gl,0,1),c=rgb(((Math.atan2(GY[i],GX[i])/6.283+.5+p.hue/100)%1+1)%1,1,.6);

addEventListener('keydown',e=>{const t=e.target.tagName;if(/INPUT|SELECT|TEXTAREA/.test(t)&&e.key!=='Escape')return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey,s=S.sel;
 if(e.code==='Space'){S.space=true;stage.style.cursor='grab';if(t!=='BUTTON')e.preventDefault();return}
 if(m&&k==='d'&&s){e.preventDefault();clone(s)}else if(m&&k==='c'&&s)S.clip=s;else if(m&&k==='v'&&S.clip){e.preventDefault();clone(S.clip)}
 else if((k==='delete'||k==='backspace')&&s){e.preventDefault();remove(s)}
 else if(k==='enter'&&s&&!S.exp){toggleCrop();ui()}
 else if(k==='escape'){if(S.exp)endExport();else if(S.fs)fs(false);else if(S.crop){S.crop=false;ui();redraw()}else select(null)}
 else if(k===']'&&s)order(s,1);else if(k==='['&&s)order(s,-1);
 else if(k==='f'&&!m)fs(!S.fs);else if(k==='0')fitTo(S.items);else if(k==='+'||k==='=')$('#zi').click();else if(k==='-')$('#zo').click();
 else if(!m&&!S.exp&&{v:'select',h:'hand',d:'draw',l:'lasso'}[k])setTool({v:'select',h:'hand',d:'draw',l:'lasso'}[k])});

/* ---------- export ---------- */
const RAT=[['16:9',16/9],['1:1',1],['3:4',.75],['4:5',.8],['9:16',9/16],['3:2',1.5],['free',0]];
function setRatio(n){const e=S.exp,k=RAT.find(r=>r[0]===n)[1],w=wrap.clientWidth,h=wrap.clientHeight;e.ratio=n;e.k=k;
 if(k){let rw=Math.min(w*.7,h*.62*k);e.r={w:rw,h:rw/k,x:(w-rw)/2,y:(h-rw/k)/2+20}}else e.r={x:w*.2,y:h*.25,w:w*.6,h:h*.5};
 $$('#ratios .btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===n));
 $('#eh').textContent=k?'Drag inside the frame to move it. Drag a corner to resize it. Scroll or pinch to zoom the picture under the frame.':'Free area: drag on the space to draw the part you want, then adjust its corners.';
 hint(k?'Frame shape '+n+'. Line up your picture inside the frame, then press save image.':'Drag on the space to draw the area you want to save.');redraw()}
RAT.forEach(([n])=>{const b=el(`<button class="btn" data-r="${n}" aria-pressed="false">${n==='free'?'free area':n}</button>`);b.onclick=()=>setRatio(n);$('#ratios').append(b)});
function startExport(){if(!S.items.length){toast('Add a photo, sticker or doodle first, then export.');return}S.exp={ratio:'16:9',k:16/9,r:{x:0,y:0,w:10,h:10}};$('#expbar').hidden=false;S.crop=false;setRatio('16:9')}
function endExport(){S.exp=null;$('#expbar').hidden=true;hint(HINTS[S.tool]);redraw()}
$('#exb').onclick=()=>S.exp?endExport():startExport();$('#ecan').onclick=endExport;$('#esz').onchange=redraw;
$('#efmt').onchange=()=>{const j=$('#efmt').value==='jpeg';$('#ebg').querySelector('[value=clear]').disabled=j;if(j&&$('#ebg').value==='clear')$('#ebg').value='white'};
window.__prlJarCapture=async()=>{const st=document.getElementById('stage'),W=st.width,H=st.height,k=W/Math.max(1,st.clientWidth),c=mk(W,H),x=c.getContext('2d');x.imageSmoothingQuality='high';
 if(window.RPBG)RPBG.paint(x,W,H,{z:S.view.z*k,x:S.view.x*k,y:S.view.y*k});scene(x,{z:S.view.z*k,x:S.view.x*k,y:S.view.y*k},W,H,{bg:window.RPBG?null:'#1d1612'});const b=await new Promise(r=>c.toBlob(r,'image/png'));if(!b)throw new Error('Could not render the picture.');
 return{blob:b,kind:'image',mime:'image/png',name:'repaint-'+Date.now()+'.png',title:'Repaint'}};
$('#esave').onclick=()=>{const e=S.exp,r=e.r,Ls=+$('#esz').value,f=$('#efmt').value,bg=$('#ebg').value,ow=r.w>=r.h?Ls:Math.round(Ls*r.w/r.h),oh=r.w>=r.h?Math.round(Ls*r.h/r.w):Ls,s=ow/r.w,c=mk(ow,oh),x=c.getContext('2d');
 x.imageSmoothingQuality='high';if(bg==='space'&&window.RPBG)RPBG.paint(x,ow,oh,{z:S.view.z*s,x:(S.view.x-r.x)*s,y:(S.view.y-r.y)*s});scene(x,{z:S.view.z*s,x:(S.view.x-r.x)*s,y:(S.view.y-r.y)*s},ow,oh,{bg:bg==='white'?'#ffffff':(bg==='space'&&!window.RPBG)?'#1d1612':null});
 c.toBlob(b=>{if(!b){toast('Export failed. Try a smaller size.');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`repaint-${Date.now()}.${f==='jpeg'?'jpg':f}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Download started: '+a.download)},'image/'+f,.92)};

/* ---------- first-run tour ---------- */
const TOUR=['Welcome. Add a photo from the tools panel, or use the example. Click it, then try a style in the edit panel.','Move around: scroll or drag with two fingers on a trackpad. Zoom with pinch or Ctrl + scroll. The space keeps going.','Double-click a photo to crop it. Drag the corners to scale it. Use the lasso tool to cut out part of a photo as a sticker.','When you are ready, choose export, pick a frame shape, line up your picture and save it.'];let ti=0;
function tour(i){ti=i;$('#tour').hidden=false;$('#tp').textContent=TOUR[i];$('#tn').textContent=i===TOUR.length-1?'done':'next'}
$('#tn').onclick=()=>{if(ti>=TOUR.length-1)$('#ts').click();else tour(ti+1)};$('#ts').onclick=()=>{$('#tour').hidden=true;try{localStorage.setItem('repaint.tour','1')}catch(_){}};$('#tip').onclick=()=>tour(0);

<script>/* theme: follows the Perilo switch; the button flips it everywhere */
(()=>{const b=document.getElementById('thm'),R=document.documentElement;const set=t=>{R.dataset.theme=t==='light'?'light':'dark';if(b)b.textContent=R.dataset.theme};
let t0=null;try{t0=localStorage.getItem('perilo.theme')}catch(_){}set(t0==='light'?'light':'dark');window.__prlSetTheme=set;
if(b)b.addEventListener('click',()=>{const n=R.dataset.theme==='light'?'dark':'light';set(n);try{localStorage.setItem('perilo.theme',n)}catch(_){}try{if(parent!==window)parent.postMessage({perilo:1,type:"theme",theme:n},"*")}catch(_){}})})();

<script>/* ===== Repaint backdrops: an endless cosmos by default (stars drift with pan and zoom), plus other looks ===== */
(()=>{
const cv=document.createElement('canvas');cv.id='cosmos';cv.setAttribute('aria-hidden','true');document.body.prepend(cv);
const g=cv.getContext('2d');let W=1,H=1,D=1,cur='cosmos',neb=null,nebKey='',last=-1,lv='';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hash=(x,y,s)=>{let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
const BGS={
 cosmos:{label:'cosmos',sw:'radial-gradient(circle at 35% 35%,#e0a779,#5a2e1c 55%,#0d0a09)',base:['#0a0706','#160e0a','#1d120d'],neb:[['196,103,58',.26],['224,167,121',.14],['155,60,50',.18],['111,194,194',.08]],stars:1,shoot:1},
 aurora:{label:'aurora',sw:'linear-gradient(160deg,#1fd1a0,#2f7fd8 50%,#020b10)',base:['#020a10','#04161f','#071019'],neb:[['31,209,160',.22],['47,127,216',.2],['141,91,240',.14]],stars:.7,bands:1},
 dusk:{label:'dusk',sw:'linear-gradient(180deg,#2a1230,#a3405a 60%,#f0a06a)',base:['#140a1c','#3a1630','#7a3a40'],neb:[['255,154,107',.22],['255,95,143',.2]],stars:.4},
 void:{label:'void',sw:'radial-gradient(circle,#2e2420,#0b0807 70%)',solid:'#0b0807',stars:.3},
 studio:{label:'studio',sw:'#1d1612',solid:'#1d1612',dots:'rgba(240,230,221,.1)'},
 paper:{label:'paper',sw:'#efe7dc',solid:'#efe7dc',dots:'rgba(60,35,20,.16)'}};
try{const s=localStorage.getItem('repaint.backdrop');if(s&&BGS[s])cur=s}catch(_){}

/* a seamless (tileable) nebula, painted once per look and size */
function nebula(B,size){const k=B.label+size;if(nebKey===k&&neb)return neb;nebKey=k;const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
 B.neb.forEach(([rgb,a],j)=>{for(let i=0;i<5;i++){const px=hash(i,j,7)*size,py=hash(i,j,11)*size,r=size*(.18+hash(i,j,13)*.3);
  for(const ox of [-size,0,size])for(const oy of [-size,0,size]){const gr=x.createRadialGradient(px+ox,py+oy,0,px+ox,py+oy,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(.55,`rgba(${rgb},${a*.35})`);gr.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=gr;x.fillRect(px+ox-r,py+oy-r,r*2,r*2)}}});
 return neb=c}
function stars(x,w,h,v,t,dens){const L=[[.1,200,.7],[.28,180,1],[.6,160,1.35]];
 L.forEach(([d,cell,big],li)=>{const z=1+(v.z-1)*d*.6,s=cell*z,ox=v.x*d,oy=v.y*d;const c0=Math.floor(-ox/s),c1=Math.floor((w-ox)/s),r0=Math.floor(-oy/s),r1=Math.floor((h-oy)/s);
  for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){const n=Math.floor((2+hash(cx,cy,li)*5)*dens);for(let k=0;k<n;k++){const a=hash(cx*7+k,cy,li+3),b=hash(cx,cy*7+k,li+5),q=hash(cx+k,cy-k,li+9);
   const px=(cx+a)*s+ox,py=(cy+b)*s+oy,rad=(.35+q*q*q*1.7)*big*Math.max(.6,Math.min(1.6,z)),tw=RM?1:.55+.45*Math.sin(t*(.8+q*2.4)+q*40),al=(.25+.75*q)*tw;
   const col=q>.86?'255,232,196':q<.18?'190,214,255':'255,255,255';x.fillStyle=`rgba(${col},${al.toFixed(3)})`;x.beginPath();x.arc(px,py,rad,0,6.283);x.fill();
   if(q>.94&&li>0){x.strokeStyle=`rgba(${col},${(al*.5).toFixed(3)})`;x.lineWidth=.8;const L2=rad*6;x.beginPath();x.moveTo(px-L2,py);x.lineTo(px+L2,py);x.moveTo(px,py-L2);x.lineTo(px,py+L2);x.stroke()}}}})}
let shoot=null;
function paint(x,w,h,v,t){v=v||{x:0,y:0,z:1};t=t||0;const B=BGS[cur];
 if(B.solid){x.fillStyle=B.solid;x.fillRect(0,0,w,h);
  if(B.dots){let st=48;while(st*v.z<22)st*=4;x.fillStyle=B.dots;const x0=Math.floor(-v.x/v.z/st)*st,y0=Math.floor(-v.y/v.z/st)*st;for(let a=x0;a*v.z+v.x<w;a+=st)for(let b=y0;b*v.z+v.y<h;b+=st)x.fillRect(a*v.z+v.x-1,b*v.z+v.y-1,2,2)}
  if(B.stars)stars(x,w,h,v,t,B.stars);return}
 const gr=x.createLinearGradient(0,0,w*.3,h);gr.addColorStop(0,B.base[0]);gr.addColorStop(.55,B.base[1]);gr.addColorStop(1,B.base[2]);x.fillStyle=gr;x.fillRect(0,0,w,h);
 /* nebula: tiled, slowly drifting, with gentle parallax */
 const sz=Math.max(w,h)*1.1,N=nebula(B,512),z=1+(v.z-1)*.08,ts=sz*z,ox=((v.x*.05+t*6)%ts+ts)%ts,oy=((v.y*.05+Math.sin(t*.05)*30)%ts+ts)%ts;
 x.save();x.globalCompositeOperation='screen';for(let a=-1;a<=Math.ceil(w/ts);a++)for(let b=-1;b<=Math.ceil(h/ts);b++)x.drawImage(N,a*ts+ox,b*ts+oy,ts,ts);x.restore();
 if(B.bands){x.save();x.globalCompositeOperation='screen';for(let i=0;i<3;i++){const y0=h*(.22+i*.1),amp=h*.06;x.beginPath();x.moveTo(0,y0);for(let px=0;px<=w;px+=24)x.lineTo(px,y0+Math.sin(px*.004+t*.3+i*1.7+v.x*.001)*amp+Math.sin(px*.011-t*.2)*amp*.3);x.lineTo(w,y0+h*.35);x.lineTo(0,y0+h*.35);x.closePath();
  const bg=x.createLinearGradient(0,y0-amp,0,y0+h*.3);bg.addColorStop(0,`rgba(${['31,209,160','80,170,255','160,110,255'][i]},${.0})`);bg.addColorStop(.12,`rgba(${['31,209,160','80,170,255','160,110,255'][i]},.22)`);bg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=bg;x.fill()}x.restore()}
 stars(x,w,h,v,t,B.stars);
 if(B.shoot&&!RM){if(!shoot&&Math.random()<.004)shoot={x:Math.random()*w*.7,y:Math.random()*h*.4,t0:t,a:.5+Math.random()*.4};
  if(shoot){const u=(t-shoot.t0)/.9;if(u>1)shoot=null;else{const L=220,px=shoot.x+u*w*.35,py=shoot.y+u*w*.35*shoot.a,gr2=x.createLinearGradient(px,py,px-L,py-L*shoot.a);gr2.addColorStop(0,`rgba(255,255,255,${(1-u)*.9})`);gr2.addColorStop(1,'rgba(255,255,255,0)');x.strokeStyle=gr2;x.lineWidth=1.6;x.beginPath();x.moveTo(px,py);x.lineTo(px-L,py-L*shoot.a);x.stroke()}}}
 const vg=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,w,h)}

/* the live canvas sits behind the whole interface; panels are glass over it */
function size(){D=Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);last=-1}
addEventListener('resize',size);size();
const stageOff=()=>{const s=document.getElementById('stage');if(!s)return{x:0,y:0};const r=s.getBoundingClientRect();return{x:r.left,y:r.top}};
function frame(ts){requestAnimationFrame(frame);if(document.hidden)return;const t=ts/1000;const view=(typeof S!=='undefined'&&S.view)?S.view:{x:0,y:0,z:1},o=stageOff(),key=view.x+','+view.y+','+view.z+','+cur+','+W;
 if(RM&&key===lv)return;if(!RM&&ts-last<32&&key===lv)return;last=ts;lv=key;
 g.setTransform(D,0,0,D,0,0);paint(g,W,H,{x:view.x+o.x,y:view.y+o.y,z:view.z},RM?0:t)}
requestAnimationFrame(frame);
function set(k){if(!BGS[k])return;cur=k;nebKey='';last=-1;lv='';try{localStorage.setItem('repaint.backdrop',k)}catch(_){}
 document.documentElement.dataset.backdrop=k;document.querySelectorAll('.bgsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bg===k)));
 typeof redraw==='function'&&redraw()}
window.RPBG={paint:(x,w,h,v)=>paint(x,w,h,v,performance.now()/1000),set,get name(){return cur},list:BGS};
/* the switcher */
const sw=document.createElement('div');sw.className='bgsw';sw.setAttribute('role','group');sw.setAttribute('aria-label','Canvas backdrop');
sw.innerHTML='<span class="bgsw-l">backdrop</span>'+Object.entries(BGS).map(([k,b])=>`<button type="button" data-bg="${k}" aria-label="${b.label} backdrop" data-tip="${b.label}" style="--sw:${b.sw}"></button>`).join('');
sw.addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(b)set(b.dataset.bg)});
const mount=()=>{const w=document.getElementById('wrap');if(w){w.appendChild(sw);set(cur)}else setTimeout(mount,50)};mount();
})();
</script>
<div id="rpIntro" role="dialog" aria-modal="true" aria-labelledby="riT" hidden>
 <div class="ri-card">
  <div class="ri-head">

<script>/* ===== Repaint intro: a short reel of what the tool does, played on its own sample picture ===== */
(()=>{
const box=document.getElementById('rpIntro');if(!box)return;const cv=document.getElementById('riCv'),x=cv.getContext('2d'),W=960,H=540,word=document.getElementById('riWord'),capEl=document.getElementById('riCap'),stepsEl=document.getElementById('riSteps');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SC=[['lasso','Draw a loop around anything to select it.'],['cut out','Lift it free. It becomes its own sticker.'],['edit','Hue, glow, contrast. Every change stays live.'],['filters','Halftone, pixel, cel. Wipe between them.'],['overlays','Stickers, colour washes, doodles on top.'],['morph','Bend it, ripple it, melt it into a new style.']];
stepsEl.innerHTML=SC.map(([n],i)=>`<li data-i="${i}"><i></i><span>${n}</span></li>`).join('');
const D=2.5,N=SC.length;
/* the sample picture, plus a few looks made from it */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const S0=540,base=mk(S0,S0),bx=base.getContext('2d');
if(typeof demo==='function')demo(bx,S0,S0);else{const gr=bx.createLinearGradient(0,0,0,S0);gr.addColorStop(0,'#8fc4e8');gr.addColorStop(1,'#f2d9a0');bx.fillStyle=gr;bx.fillRect(0,0,S0,S0)}
const id=bx.getImageData(0,0,S0,S0).data;
const pix=mk(S0,S0),px=pix.getContext('2d'),tiny=mk(36,36);tiny.getContext('2d').drawImage(base,0,0,36,36);px.imageSmoothingEnabled=false;px.drawImage(tiny,0,0,S0,S0);
const cel=mk(S0,S0),cx=cel.getContext('2d'),ci=cx.createImageData(S0,S0);for(let i=0;i<id.length;i+=4){for(let c=0;c<3;c++)ci.data[i+c]=Math.round(id[i+c]/64)*64+20;ci.data[i+3]=255}cx.putImageData(ci,0,0);
cx.globalCompositeOperation='multiply';cx.strokeStyle='rgba(40,20,30,.55)';cx.lineWidth=3;cx.strokeRect(2,2,S0-4,S0-4);
const half=mk(S0,S0),hx=half.getContext('2d');hx.fillStyle='#1d1612';hx.fillRect(0,0,S0,S0);for(let y=6;y<S0;y+=12)for(let xx=6;xx<S0;xx+=12){const i=(y*S0+xx)*4,L=(id[i]*.3+id[i+1]*.59+id[i+2]*.11)/255;hx.fillStyle=`rgb(${id[i]},${id[i+1]},${id[i+2]})`;hx.beginPath();hx.arc(xx,y,1+L*5.4,0,6.283);hx.fill()}
/* where things sit: the picture in the middle of the frame, the flower as the thing we cut */
const PX=(W-400)/2,PY=(H-400)/2,PS=400,k=PS/S0,FX=PX+S0*.5*k,FY=PY+S0*.36*k,FR=150*k*1.05;
const lassoPts=[...Array(64)].map((_,i)=>{const a=i/64*6.283-1.6,r=FR*(1+.08*Math.sin(a*5)+.05*Math.sin(a*3+1));return[FX+Math.cos(a)*r,FY+Math.sin(a)*r*1.06]});
const ease=u=>1-Math.pow(1-Math.min(1,Math.max(0,u)),3),back=u=>{u=Math.min(1,Math.max(0,u));const c=1.7;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const path=(n)=>{x.beginPath();lassoPts.slice(0,Math.max(2,n)).forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b))};
function frameRect(){x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=30;x.shadowOffsetY=14;x.fillStyle='#000';x.fillRect(PX,PY,PS,PS);x.restore()}
function photo(img,alpha=1,filter){x.save();x.globalAlpha=alpha;if(filter)x.filter=filter;x.drawImage(img||base,PX,PY,PS,PS);x.restore()}
function bgSpace(t){const gr=x.createRadialGradient(W*.5,H*.45,40,W*.5,H*.5,W*.7);gr.addColorStop(0,'#2a1a12');gr.addColorStop(1,'#0d0a09');x.fillStyle=gr;x.fillRect(0,0,W,H);
 for(let i=0;i<120;i++){const a=(Math.sin(i*12.9898)*43758.5453)%1,b=(Math.sin(i*78.233)*12345.678)%1,sx=Math.abs(a)*W,sy=Math.abs(b)*H,tw=.4+.6*Math.abs(Math.sin(t*1.3+i));x.fillStyle=`rgba(255,255,255,${(tw*.7).toFixed(2)})`;x.fillRect(sx,sy,1.6,1.6)}}
function ants(t,n){x.save();path(n);if(n>=lassoPts.length)x.closePath();x.setLineDash([9,7]);x.lineDashOffset=-t*40;x.lineWidth=2.4;x.strokeStyle='#fff';x.stroke();x.lineDashOffset=-t*40+8;x.strokeStyle='#1d1612';x.stroke();x.restore()}
function cursor(cx2,cy2,kind){x.save();x.translate(cx2,cy2);x.fillStyle='#fff';x.strokeStyle='#1d1612';x.lineWidth=2;
 if(kind==='lasso'){x.beginPath();x.ellipse(10,-8,12,8,-.4,0,6.283);x.stroke();x.beginPath();x.moveTo(0,0);x.lineTo(4,-4);x.stroke()}
 else{x.beginPath();x.moveTo(0,0);x.lineTo(0,20);x.lineTo(5,15);x.lineTo(9,24);x.lineTo(12,22);x.lineTo(8,14);x.lineTo(15,14);x.closePath();x.fill();x.stroke()}x.restore()}
function cutout(dx,dy,s,r,glow){x.save();x.translate(FX+dx,FY+dy);x.rotate(r);x.scale(s,s);x.translate(-FX,-FY);if(glow){x.shadowColor='rgba(224,167,121,.9)';x.shadowBlur=glow}path(64);x.closePath();x.clip();x.drawImage(base,PX,PY,PS,PS);x.restore()}
function slider(i,label,v,col){const y=PY+60+i*58,x0=PX+PS+40,w=150;x.save();x.font='700 12px "Space Mono",monospace';x.fillStyle='rgba(255,255,255,.75)';x.fillText(label.toUpperCase(),x0,y-10);x.fillStyle='rgba(255,255,255,.15)';x.fillRect(x0,y,w,6);const gr=x.createLinearGradient(x0,0,x0+w,0);gr.addColorStop(0,'#6fc2c2');gr.addColorStop(1,col);x.fillStyle=gr;x.fillRect(x0,y,w*v,6);x.fillStyle='#fff';x.beginPath();x.arc(x0+w*v,y+3,8,0,6.283);x.fill();x.restore()}
function sticker(ch,sx,sy,u,size){if(u<=0)return;const s=back(u);x.save();x.translate(sx,sy);x.rotate((1-ease(u))*.8);x.scale(s,s);x.font=size+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,0,0);x.restore()}
function scene(i,u,t){/* u: 0..1 through this scene */
 bgSpace(t);
 if(i===0){frameRect();photo();const n=Math.floor(ease(u/.65)*lassoPts.length);if(u>.68){x.save();x.fillStyle='rgba(13,10,9,.55)';x.beginPath();x.rect(PX,PY,PS,PS);path(64);x.closePath();x.fill('evenodd');x.restore()}
  ants(t,n);const p=lassoPts[Math.min(lassoPts.length-1,Math.max(0,n-1))];if(u<.7)cursor(p[0],p[1],'lasso');if(u>.68&&u<.82){x.save();x.globalAlpha=(1-(u-.68)/.14)*.6;x.fillStyle='#fff';path(64);x.closePath();x.fill();x.restore()}}
 else if(i===1){frameRect();photo();x.save();x.fillStyle='rgba(13,10,9,.72)';path(64);x.closePath();x.fill();x.setLineDash([6,6]);x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1.5;x.stroke();x.restore();
  const e=back(u/.55);cutout(150*e,-40*e,1+.18*e,-.12*e,30*e);if(u>.5)cursor(FX+150+60,FY-40+50,'arrow')}
 else if(i===2){frameRect();const hue=Math.sin(u*Math.PI*1.4)*140,sat=1+ease(u)*1.1,con=1+Math.sin(u*Math.PI)*.35;photo(null,1,`hue-rotate(${hue.toFixed(0)}deg) saturate(${sat.toFixed(2)}) contrast(${con.toFixed(2)})`);
  slider(0,'hue',.5+hue/280,'#c4673a');slider(1,'glow',ease(u),'#e0a779');slider(2,'contrast',.4+Math.sin(u*Math.PI)*.4,'#6fc2c2')}
 else if(i===3){frameRect();const L=[half,pix,cel],names=['halftone','pixel','cel'],seg=Math.min(2,Math.floor(u*3)),v=(u*3)%1,wx=PX+PS*ease(v);
  photo(seg?L[seg-1]:base);x.save();x.beginPath();x.rect(PX,PY,wx-PX,PS);x.clip();photo(L[seg]);x.restore();
  x.save();x.fillStyle='#fff';x.fillRect(wx-1.5,PY-10,3,PS+20);x.beginPath();x.arc(wx,PY+PS/2,16,0,6.283);x.fill();x.fillStyle='#1d1612';x.font='700 14px "Space Mono",monospace';x.textAlign='center';x.textBaseline='middle';x.fillText('⇆',wx,PY+PS/2+1);
  x.font='700 12px "Space Mono",monospace';x.fillStyle='rgba(255,255,255,.85)';x.fillText(names[seg].toUpperCase(),wx,PY-22);x.restore()}
 else if(i===4){frameRect();photo();x.save();x.globalCompositeOperation='overlay';const gr=x.createLinearGradient(PX,PY,PX+PS,PY+PS);const sh=u*PS;gr.addColorStop(0,'rgba(111,194,194,.0)');gr.addColorStop(Math.min(.95,.2+u*.5),'rgba(224,167,121,.85)');gr.addColorStop(1,'rgba(196,103,58,.9)');x.fillStyle=gr;x.fillRect(PX,PY,PS,PS);x.restore();
  sticker('✨',PX+70,PY+70,(u-.05)/.25,58);sticker('🌸',PX+PS-60,PY+PS-80,(u-.2)/.25,64);sticker('⭐',PX+PS-90,PY+90,(u-.32)/.25,52);sticker('🦋',PX+90,PY+PS-70,(u-.44)/.25,60);
  const n=Math.floor(ease((u-.15)/.7)*40);x.save();x.strokeStyle='#FFE36E';x.lineWidth=6;x.lineCap='round';x.lineJoin='round';x.beginPath();for(let j=0;j<n;j++){const a=j/40,px2=PX+60+a*(PS-120),py2=PY+PS*.82+Math.sin(a*18)*14;j?x.lineTo(px2,py2):x.moveTo(px2,py2)}x.stroke();x.restore()}
 else{frameRect();const amp=Math.sin(Math.min(1,u*1.3)*Math.PI)*22,mix=ease((u-.35)/.5),sl=24;
  for(let s=0;s<sl;s++){const sy=s*PS/sl,off=Math.sin(s*.55+t*5)*amp;x.save();x.beginPath();x.rect(PX-30,PY+sy,PS+60,PS/sl+1);x.clip();x.drawImage(base,PX+off,PY,PS,PS);if(mix>0){x.globalAlpha=mix;x.drawImage(cel,PX+off*.6,PY,PS,PS)}x.restore()}
  const rx=PX+PS*(.3+.4*Math.sin(t*1.6)),ry=PY+PS*(.45+.25*Math.cos(t*1.2));x.save();x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=2;x.beginPath();x.arc(rx,ry,30+8*Math.sin(t*6),0,6.283);x.stroke();x.restore()}
 x.save();x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=1;x.strokeRect(.5,.5,W-1,H-1);x.restore()}
let t0=0,raf=0,on=false,curI=-1;
function setStep(i,u){if(i!==curI){curI=i;word.textContent=SC[i][0];capEl.textContent=SC[i][1];word.classList.remove('pop');void word.offsetWidth;word.classList.add('pop');
  [...stepsEl.children].forEach((li,j)=>{li.classList.toggle('on',j===i);li.classList.toggle('done',j<i)})}
 const li=stepsEl.children[i];li&&li.style.setProperty('--p',(u*100).toFixed(1)+'%')}
function loop(ts){if(!on)return;raf=requestAnimationFrame(loop);const t=(ts-t0)/1000,i=Math.floor(t/D)%N,u=(t%D)/D;setStep(i,u);scene(i,RM?1:u,RM?0:t)}
function open(){if(on)return;on=true;box.hidden=false;document.body.classList.add('preintro');curI=-1;t0=performance.now();box.classList.remove('out');requestAnimationFrame(()=>box.classList.add('in'));raf=requestAnimationFrame(loop);setTimeout(()=>{try{document.getElementById('riGo').focus({preventScroll:true})}catch(_){}},60)}
function close(){if(!on)return;on=false;box.classList.remove('in');box.classList.add('out');document.body.classList.remove('preintro');setTimeout(()=>{box.hidden=true;cancelAnimationFrame(raf);window.__rpTour&&window.__rpTour()},RM?0:620);try{document.getElementById('stage').focus({preventScroll:true})}catch(_){}}
document.getElementById('riGo').onclick=close;document.getElementById('riSkip').onclick=close;
stepsEl.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;t0=performance.now()-(+li.dataset.i)*D*1000});
addEventListener('keydown',e=>{if(on&&e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}},true);
window.__rpIntro={open,close,get on(){return on}};window.__prlReplay=()=>open();
const help=document.getElementById('intro');if(help)help.onclick=open;
if(document.readyState==='complete')setTimeout(open,120);else addEventListener('load',()=>setTimeout(open,120));
})();
</script>
